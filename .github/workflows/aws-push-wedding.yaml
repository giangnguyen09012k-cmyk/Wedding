name: aws-push-wedding | Push Wedding to Bucket

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  push-to-bucket:
    name: Push to Bucket on AWS
    runs-on: ubuntu-latest
    environment: aws-gg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::423427814705:role/github-actions-repo
          aws-region: us-east-1

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Push to Bucket
        run: |
          aws s3 sync . s3://wedding-monte --delete
