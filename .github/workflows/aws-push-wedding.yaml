name: aws-push-wedding | Push Wedding to Bucket

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  push-to-bucket:
    name: Push to Bucket on AWS
    runs-on: ubuntu-latest
    environment: aws-gg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ vars.MAIN_REGION }}

      - name: Push to Bucket
        run: |
          aws s3 sync . ${{ vars.BUCKET_WEDDING }} --delete
