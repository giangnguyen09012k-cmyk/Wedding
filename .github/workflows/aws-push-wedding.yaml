name: aws-push-wedding | Push Wedding to Bucket

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  push-to-bucket:
    name: Push to Bucket on AWS
    runs-on: ubuntu-latest
    environment: aws-gg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC Token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          echo "JWT payload:"
          echo $TOKEN | cut -d'.' -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ vars.MAIN_REGION }}

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Push to Bucket
        run: |
          aws s3 sync . ${{ vars.BUCKET_WEDDING }} --delete
